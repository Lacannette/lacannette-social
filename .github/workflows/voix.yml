name: Voix off (essais)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Voix Henri
        run: |
          pip install -q --upgrade edge-tts
          for f in voix/textes/*.txt; do
            n=$(basename "$f" .txt)
            edge-tts --voice fr-FR-HenriNeural --rate=+4% --file "$f" --write-media "voix/henri-$n.mp3"
          done
      - name: Enregistrer
        run: |
          for f in voix/*.wav; do [ -f "$f" ] && ffmpeg -loglevel error -y -i "$f" -b:a 160k "${f%.wav}.mp3" && rm "$f"; done
          git config user.name "robot-lacannette"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voix
          git commit -m "Essais de voix off" || exit 0
          git pull --rebase --quiet && git push
