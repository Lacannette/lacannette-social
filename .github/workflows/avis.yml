name: Avis Google

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avis
  cancel-in-progress: false

jobs:
  avis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les avis Google
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: python scripts/avis_google.py
      - name: Enregistrer
        run: |
          git config user.name "Robot LaCannette"
          git config user.email "robot@lacannette.fr"
          git add avis/
          git diff --cached --quiet && exit 0
          git commit -m "Avis Google : mise à jour"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
